[package]
name = "streamforge_api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
aws-config = "1.8.16"
aws-sdk-s3 = "1.132.0"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = [
  "runtime-tokio",
  "tls-native-tls",
  "postgres",
  "chrono",
  "migrate",
  "uuid",
] }
tokio = { version = "1.52.3", features = [
  "rt-multi-thread",
  "tracing",
  "signal",
  "net",
] }
tower = "0.5.3"
tower-http = { version = "0.6.10", features = [
  "trace",
  "timeout",
  "cors",
  "compression-full",
  "decompression-full",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2.0"
utoipa-redoc = { version = "6.0.0", features = ["axum"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = { version = "1.15.1", features = ["v7", "v4"] }
validator = { version = "0.20.0", features = ["derive"] }

[dev-dependencies]
reqwest = { version = "0.13.4", features = ["json"] }
testcontainers = { version = "0.27.3" }
